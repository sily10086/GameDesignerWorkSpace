name: Release Windows workbench
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm ci
      - run: npm run prepare:runtime
      - run: npm test
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
          }
      - run: npm run build:release
      - run: npm run test:installer
      - name: Publish verified installer and update manifest
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
